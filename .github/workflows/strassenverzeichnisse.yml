# Erzeugt jede Nacht die Straßenverzeichnisse aller aktiven Kommunen (strassen/*.json).
# Neue Kommune angelegt? Unter „Actions → Straßenverzeichnisse → Run workflow“ sofort starten,
# sonst ist ihr Verzeichnis spätestens am nächsten Morgen da. Bis dahin sucht die App online.
name: Straßenverzeichnisse

on:
  schedule:
    - cron: "23 1 * * *"
  workflow_dispatch:
    inputs:
      alle:
        description: "Alle Verzeichnisse neu erzeugen (sonst nur fehlende und ältere als 30 Tage)"
        type: boolean
        default: false

permissions:
  contents: write
  pages: write

concurrency:
  group: strassenverzeichnisse
  cancel-in-progress: false

jobs:
  erzeugen:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Verzeichnisse erzeugen
        run: python3 werkzeug/strassen_erzeugen.py ${{ inputs.alle && '--alle' || '' }}
      - name: Veröffentlichen
        run: |
          git add strassen
          if git diff --cached --quiet; then echo "Keine Änderungen."; exit 0; fi
          git config user.name "Straßenverzeichnis"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Straßenverzeichnisse aktualisieren"
          git push
          # GitHub Pages neu bauen lassen (Pushes mit dem Workflow-Token lösen das nicht immer aus).
          curl -sS -X POST -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/pages/builds" || true
